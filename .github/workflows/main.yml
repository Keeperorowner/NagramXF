name: Patch and Build APK

on:
  push:
    branches: [ master, main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download tools and base APK
        run: |
          mkdir -p workdir
          cd workdir
          
          pip install --no-cache-dir gdown
          gdown "https://drive.google.com/uc?id=1D4pwwNPJ8coKIUMh8kR_NO0E1pBwR2vV" -O base.apk
          
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          wget -q -O signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          java -jar apktool.jar d -s base.apk -o decompiled -f

      - name: Inject Ukrainian strings
        run: |
          python3 - << 'EOF'
          import os, glob, re

          target_file = 'workdir/decompiled/res/values-uk/strings.xml'
          os.makedirs(os.path.dirname(target_file), exist_ok=True)
          
          if os.path.exists(target_file):
              with open(target_file, 'r', encoding='utf-8') as f:
                  target_content = f.read()
          else:
              target_content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>'

          # Знаходимо всі xml-файли перекладу у репозиторії
          source_files = [f for f in glob.glob('**/values-uk/*.xml', recursive=True) if 'workdir' not in f]
          
          new_tags = []
          for src in source_files:
              with open(src, 'r', encoding='utf-8') as f:
                  content = f.read()
                  tags = re.findall(r'(<(?:string|plurals|string-array)\s+[^>]*name="([^"]+)"[\s\S]*?</(?:string|plurals|string-array)>)', content)
                  for full_tag, name in tags:
                      pattern = rf'<(?:string|plurals|string-array)\s+[^>]*name="{re.escape(name)}"[\s\S]*?</(?:string|plurals|string-array)>'
                      if re.search(pattern, target_content):
                          target_content = re.sub(pattern, full_tag, target_content)
                      else:
                          new_tags.append(full_tag)

          # Додаємо всі унікальні рядки перед закриваючим тегом </resources>
          if new_tags:
              insert_text = '\n    ' + '\n    '.join(new_tags) + '\n</resources>'
              target_content = re.sub(r'</resources>', insert_text, target_content)

          with open(target_file, 'w', encoding='utf-8') as f:
              f.write(target_content)

          print(f"Знайдено та оброблено файлів: {len(source_files)}. Додано нових модульних рядків: {len(new_tags)}.")
          EOF

      - name: Rebuild and Sign APK
        run: |
          cd workdir
          java -jar apktool.jar b decompiled -o patched_unsigned.apk
          java -jar signer.jar --apks patched_unsigned.apk --allowResign -o output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-Ukrainian-APK
          path: workdir/output/*.apk
