name: Patch and Build APK

on:
  push:
    branches: [ master, main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download tools and base APK
        run: |
          mkdir -p workdir
          cd workdir
          
          pip install --no-cache-dir gdown
          gdown "https://drive.google.com/uc?id=1D4pwwNPJ8coKIUMh8kR_NO0E1pBwR2vV" -O base.apk
          
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          wget -q -O signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          java -jar apktool.jar d -s base.apk -o decompiled -f

      - name: Inject Ukrainian strings
        run: |
          python3 - << 'EOF'
          import os, re

          strings_to_add = {}

          # 1. Повний рекурсивний пошук усіх файлів перекладу у репозиторії
          for root, dirs, files in os.walk('.'):
              if 'workdir' in root or '.git' in root:
                  continue
              for file in files:
                  if file.endswith('.xml') and ('values-uk' in root or file.startswith('strings_')):
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          tags = re.findall(r'(<(?:string|plurals|string-array)\s+[^>]*name="([^"]+)"[\s\S]*?</(?:string|plurals|string-array)>)', content)
                          for full_tag, name in tags:
                              strings_to_add[name] = full_tag
                          print(f"Знайдено {len(tags)} рядків у: {file_path}")
                      except Exception as e:
                          print(f"Помилка читання {file_path}: {e}")

          print(f"Усього зібрано унікальних рядків: {len(strings_to_add)}")

          # 2. Оновлення strings.xml у values-uk та values-uk-rUA
          target_dirs = [
              'workdir/decompiled/res/values-uk',
              'workdir/decompiled/res/values-uk-rUA'
          ]

          for t_dir in target_dirs:
              os.makedirs(t_dir, exist_ok=True)
              t_file = os.path.join(t_dir, 'strings.xml')
              
              if os.path.exists(t_file):
                  with open(t_file, 'r', encoding='utf-8') as f:
                      content = f.read()
              else:
                  content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>'

              content = content.replace('</resources>', '').strip()

              for name, tag in strings_to_add.items():
                  pattern = rf'<(?:string|plurals|string-array)\s+[^>]*name="{re.escape(name)}"[\s\S]*?</(?:string|plurals|string-array)>'
                  if re.search(pattern, content):
                      content = re.sub(pattern, tag, content)
                  else:
                      content += f'\n    {tag}'

              content += '\n</resources>\n'

              with open(t_file, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"Оновлено: {t_file}")
          EOF

      - name: Rebuild and Sign APK
        run: |
          cd workdir
          java -jar apktool.jar b decompiled -o patched_unsigned.apk
          java -jar signer.jar --apks patched_unsigned.apk --allowResign -o output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-Ukrainian-APK
          path: workdir/output/*.apk
