name: Patch and Build APK

on:
  push:
    branches: [ master, main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download tools and base APK
        run: |
          mkdir -p workdir
          cd workdir
          
          pip install --no-cache-dir gdown
          gdown "https://drive.google.com/uc?id=1D4pwwNPJ8coKIUMh8kR_NO0E1pBwR2vV" -O base.apk
          
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          wget -q -O signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          java -jar apktool.jar d -s base.apk -o decompiled -f

      - name: Inject Ukrainian strings
        run: |
          mkdir -p workdir/decompiled/res/values-uk
          python3 - << 'EOF'
          import os, glob, re

          # Знаходимо всі xml файли перекладу у репозиторії
          xml_files = [f for f in glob.glob('**/values-uk/*.xml', recursive=True) if 'workdir' not in f]
          
          all_strings = {}
          for file in xml_files:
              with open(file, 'r', encoding='utf-8') as f:
                  content = f.read()
                  matches = re.findall(r'(<string\s+name="([^"]+)">.*?</string>)', content, re.DOTALL)
                  for full_tag, name in matches:
                      all_strings[name] = full_tag

          # Записуємо об'єднаний strings.xml для Apktool
          output_path = 'workdir/decompiled/res/values-uk/strings.xml'
          with open(output_path, 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
              for tag in all_strings.values():
                  f.write(f'    {tag}\n')
              f.write('</resources>\n')
          print(f"Знайдено файлів: {len(xml_files)}. Успішно впроваджено {len(all_strings)} рядків перекладу.")
          EOF

      - name: Rebuild and Sign APK
        run: |
          cd workdir
          java -jar apktool.jar b decompiled -o patched_unsigned.apk
          java -jar signer.jar --apks patched_unsigned.apk --allowResign -o output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NagramX-Ukrainian-APK
          path: workdir/output/*.apk
